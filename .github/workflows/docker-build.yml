name: Docker Build

on:
  # 1. Runs on Pull Requests to test if Dockerfile builds successfully
  pull_request:
    branches:
      - master
  # 2. Runs on Push to master EXCEPT when infra files changed   
  push:
    branches:
      - master
    paths-ignore:
      - 'infra/**'

  # 3. Run automatically whenever the Terraform Infrastructure workflow completes on main
  workflow_run:
    workflows: ["Terraform Infrastructure"]
    types:
      - completed
    branches:
      - master

permissions:
  id-token: write # required for OIDC, use GITHUB_OIDC_ROLE
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }} # Amazon ECR repository name
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}

jobs:
  # JOB 1: Test Build for PRs
  pr-check:
    name: Test Docker build for PRs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Test Build App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          tags: ${{ env.ECR_REPOSITORY }}:test
  
  # JOB 2: Build and push Docker images on push to master
  build-and-push:
    name: Build, Push and Deploy to Prod
    # If triggered by workflow_run, only run if Terraform succeeded
    if: |
      github.event_name != 'pull_request' && 
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # - name: Inspect GitHub OIDC Token Payload
      #   run: |
      #     curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #     "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value' | cut -d '.' -f 2 | base64 -d | jq .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-nginx:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-nginx:${{ github.sha }}

      # Deploy the immutable :<sha> images by registering a new task definition revision
      # derived from the one the service currently runs. Rolls back if it fails to stabilize.
      - name: Deploy to ECS
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Save current running task definition for rollback if deployment fails
          PREV_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current running task definition: $PREV_TASK_DEF_ARN"

          # Fetch the latest registered task definition family revision created by Terraform
          LATEST_TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Fetching configuration from $LATEST_TASK_DEF_ARN"
          
          aws ecs describe-task-definition --task-definition "$LATEST_TASK_DEF_ARN" \
            --query 'taskDefinition' > task-def-current.json

          jq --arg app "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
             --arg nginx "$REGISTRY/$ECR_REPOSITORY-nginx:$IMAGE_TAG" '
            .containerDefinitions |= map(
              if .name == "wordpress" then .image = $app
              elif .name == "nginx" then .image = $nginx
              else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' task-def-current.json > task-def-new.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task definition: $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" > /dev/null

          if ! aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --cli-read-timeout 900 --cli-connect-timeout 60; then
            echo "::error::Deployment did not stabilize, rolling back to $PREV_TASK_DEF_ARN"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --task-definition "$PREV_TASK_DEF_ARN" > /dev/null
            exit 1
          fi
          echo "Deployment completed successfully"

      - name: Deployment status
        if: always()
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].{TaskDefinition:taskDefinition,Running:runningCount,Desired:desiredCount,Status:status}' \
            --output table
