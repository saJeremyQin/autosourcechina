name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - master
    paths:
      - "infra/**"
  push:
    branches:
      - master
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    outputs:
      task_definition_changed: ${{ steps.plan-summary.outputs.task_definition_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && env.AWS_TERRAFORM_PLAN_ROLE_ARN || env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config=backend-prod.hcl

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -var-file=prod.tfvars -out=tfplan

      - name: Check for ECS task-definition changes
        id: plan-summary
        working-directory: infra
        run: |
          set -euo pipefail

          terraform show -json tfplan > tfplan.json
          changed=$(jq -r '
            [
              .resource_changes[]?
              | select(.address == "module.ecs.aws_ecs_task_definition.this")
              | .change.actions[]
            ]
            | any(. != "no-op")
          ' tfplan.json)

          echo "task_definition_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ECS task definition changed: $changed"

      - name: Upload Terraform plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply Terraform and deploy ECS configuration
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config=backend-prod.hcl

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Update ECS service for task-definition changes
        if: needs.plan.outputs.task_definition_changed == 'true'
        working-directory: infra
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN=$(terraform output -raw task_definition_arn)
          echo "Deploying Terraform task definition: $TASK_DEFINITION_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            > /dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60

      - name: Show infrastructure outputs
        working-directory: infra
        run: terraform output
