# Page cache for anonymous visitors. It lives in this task's nginx container,
# so it starts empty on every deploy and is never shared between tasks.
fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=wordpress:20m
                   max_size=256m inactive=60m use_temp_path=off;
fastcgi_cache_key "$request_method$host$request_uri";

# Requests arrive through the ALB; take the visitor's address from
# X-Forwarded-For so rate limits and logs apply per visitor, not per ALB node.
set_real_ip_from 10.0.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-visitor limit on requests that reach PHP (cached pages included). A page
# view is one request; the burst covers admin screens and the Elementor editor,
# which fire dozens at once. Scanners that keep going get fast 429s instead of
# tying up the PHP workers.
limit_req_zone $binary_remote_addr zone=php_per_ip:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Anything personal or state-changing goes straight to PHP.
    set $skip_cache 0;
    if ($request_method = POST) {
        set $skip_cache 1;
    }
    if ($query_string != "") {
        set $skip_cache 1;
    }
    if ($request_uri ~* "/wp-admin/|/wp-json/|/xmlrpc.php|wp-.*\.php|/cart/|/checkout/|/my-account/|/wc-api/|/feed/|sitemap") {
        set $skip_cache 1;
    }
    # Logged-in users, commenters, password-protected posts and shoppers with a cart.
    if ($http_cookie ~* "wordpress_logged_in|wordpress_sec|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Dotfiles (.env, .git/, .htaccess) are never served; scanners probe them first.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Uploads are user content; nothing in them may run as PHP.
    location ~* ^/wp-content/uploads/.*\.php$ {
        return 404;
    }

    # XML-RPC is unused here and a common brute-force target.
    location = /xmlrpc.php {
        return 404;
    }

    location ~ \.php$ {
        # Answer requests for PHP files that don't exist (phpinfo.php, test1.php,
        # wp-config.php, which is generated only in the wordpress container)
        # here, instead of booting WordPress to render a 404.
        try_files $uri =404;

        limit_req zone=php_per_ip burst=40 nodelay;

        include fastcgi_params;
        # PHP-FPM runs in the same ECS task (shared awsvpc network namespace).
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Edits (prices, stock, content) reach visitors within 10 minutes. Responses
        # that set a cookie or send no-cache headers are never stored.
        fastcgi_cache wordpress;
        fastcgi_cache_valid 200 301 302 10m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_lock on;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        add_header X-Cache $upstream_cache_status always;
    }
}
