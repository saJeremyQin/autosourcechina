services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      target: app
    image: autosourcechina-app:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WP_SITE_URL: ${WP_SITE_URL}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ACTIVATE_PLUGINS: ${WP_ACTIVATE_PLUGINS}
      WP_ACTIVATE_THEME: ${WP_ACTIVATE_THEME:-blocksy}
    volumes:
      - uploads:/var/www/html/wp-content/uploads
    # nginx 与本服务共用网络，因此由这里发布 nginx 的 80 端口
    ports:
      - "8080:80"

  nginx:
    build:
      context: .
      target: nginx
    image: autosourcechina-nginx:local
    depends_on:
      - wordpress
    # 模拟 ECS：nginx 和 PHP-FPM 共用网络，生产配置中的
    # 127.0.0.1:9000 因此也能在本地使用
    network_mode: "service:wordpress"
    volumes:
      - uploads:/var/www/html/wp-content/uploads:ro

volumes:
  db_data:
  uploads: